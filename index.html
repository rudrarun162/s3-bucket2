<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Background Demo</title>
    <style>
        body {
            /* Sets the entire page background to red */
            background-color: #FF0000; 
            /* White text ensures good contrast and readability */
            color: #FFFFFF; 
            font-family: Arial, sans-serif;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>Hello, World!</h1>
    <p>This page uses internal CSS to create a pure red background.</p>
</body>
</html>
