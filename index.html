<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Background Demo</title>
    <style>
        body {
            /* Sets the background color of the whole page */
            background-color: dodgerblue; 
            /* Changes text color to white for better readability */
            color: white; 
            /* Standard clean font */
            font-family: Arial, sans-serif; 
            margin: 40px;
        }
    </style>
</head>
<body>

    <h1>Hello World!</h1>
    <p>This web page has a modern blue background color.</p>

</body>
</html>
